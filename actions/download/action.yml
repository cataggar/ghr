name: 'ghr download'
description: >-
  Download one or more release assets using `ghr`. Optionally extracts each
  archive into a destination directory and caches the result across runs.
author: 'cataggar/ghr contributors'
branding:
  icon: 'download'
  color: 'gray-dark'

inputs:
  tools:
    description: >-
      Newline-separated list of release specs to download. Each entry is
      `owner/repo[@tag]` (auto-pick asset) or `owner/repo/file[@tag]`
      (specific asset). Lines that are empty or start with `#` are
      ignored.
    required: true
  dest:
    description: >-
      Directory to download (and optionally extract) into. Default: the
      runner's `$RUNNER_TEMP/ghr-download`.
    required: false
    default: ''
  extract:
    description: >-
      Extract archive assets into `dest` after download (uses
      `ghr download --extract`). Default: false.
    required: false
    default: 'false'
  strip-components:
    description: >-
      When `extract` is true, strip N leading path components from
      extracted entries.
    required: false
    default: ''
  cache:
    description: >-
      Cache the `dest` directory across runs. Default: true. The cache
      key covers OS, architecture, normalized sources, extraction settings,
      verification policy, minisign key, and ghr version.
    required: false
    default: 'true'
  minisign:
    description: >-
      Optional base64 minisign public key. When set, ghr also requires a
      `.minisig` sidecar to be present for every spec and verifies it.
    required: false
    default: ''
  skip-verify:
    description: >-
      Umbrella flag: skip every verification step (checksum, minisign,
      sigstore, GitHub attestation, authenticode). Default: false.
    required: false
    default: 'false'
  skip-checksum:
    description: >-
      Skip just the checksum-sidecar verification step. Default: false.
    required: false
    default: 'false'
  skip-minisign:
    description: >-
      Skip just the minisign verification step. Bypasses the fail-closed
      behavior that would otherwise reject a published `.minisig` sidecar
      when no key is configured. Default: false.
    required: false
    default: 'false'
  skip-sigstore:
    description: >-
      Skip just the verification of a `.sigstore.json` sidecar published as a
      release asset. Does not affect GitHub's attestation service; use
      `skip-attestation` for that. Default: false.
    required: false
    default: 'false'
  skip-attestation:
    description: >-
      Skip just the GitHub artifact attestation verification step.
      Attestations are looked up from GitHub's attestation API by the
      downloaded file's digest rather than published as release assets, so
      this is independent of `skip-sigstore`. Default: false.
    required: false
    default: 'false'
  skip-authenticode:
    description: >-
      Skip just the Authenticode (Windows PE) verification step.
      Default: false.
    required: false
    default: 'false'
  keep-going:
    description: >-
      Continue past per-spec failures. The job step still exits non-zero
      if any spec failed, but every spec is attempted first.
    required: false
    default: 'false'
  ghr-version:
    description: >-
      Exact ghr release tag or version. By default an exact action tag such as
      `@v0.8.0` selects the matching CLI release. Commit-, branch-, and
      floating-tag pins must set this input explicitly; `latest` and version
      ranges are rejected.
    required: false
    default: ''
  ghr-sha256:
    description: >-
      Optional independently trusted SHA-256 for the selected ghr release
      archive. It must also match GitHub's release-asset digest. When omitted,
      GitHub release provenance is verified cryptographically with Sigstore.
    required: false
    default: ''
  ghr-token:
    description: >-
      Token used only to resolve and verify the ghr release. The downstream
      download command continues to use GH_TOKEN or GITHUB_TOKEN from env.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  ghr-cache:
    description: >-
      Cache the exact verified ghr archive and installation. This is separate
      from the downloaded-assets cache controlled by `cache`.
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: >-
      `true` when the download cache was restored from a prior run.
    value: ${{ steps.ghr-cache.outputs.cache-hit }}
  dest:
    description: >-
      Absolute path of the resolved destination directory.
    value: ${{ steps.ghr-dest.outputs.dest }}

runs:
  using: composite
  steps:
    - name: Setup verified ghr
      id: setup-ghr
      uses: $/actions/setup
      with:
        ghr-version: ${{ inputs.ghr-version || github.action_ref }}
        sha256: ${{ inputs.ghr-sha256 }}
        token: ${{ inputs.ghr-token }}
        cache: ${{ inputs.ghr-cache }}

    - name: Resolve destination directory
      id: ghr-dest
      shell: bash
      env:
        DEST_INPUT: ${{ inputs.dest }}
      run: |
        set -euo pipefail
        if [[ -z "${DEST_INPUT}" ]]; then
          dest="${RUNNER_TEMP}/ghr-download"
        else
          dest="${DEST_INPUT}"
        fi
        mkdir -p "$dest"
        # The Actions runner consumes `working-directory` before launching
        # bash, so Windows must retain a native path rather than MSYS `/d/...`.
        if [[ "${RUNNER_OS}" == "Windows" ]]; then
          dest_abs="$(cygpath -aw "$dest")"
        else
          dest_abs="$(cd "$dest" && pwd)"
        fi
        echo "dest=$dest_abs" >> "$GITHUB_OUTPUT"

    - name: Resolve cache key
      id: cache-key
      shell: bash
      env:
        TOOLS_INPUT: ${{ inputs.tools }}
        EXTRACT: ${{ inputs.extract }}
        STRIP: ${{ inputs.strip-components }}
        MINISIGN: ${{ inputs.minisign }}
        SKIP_VERIFY: ${{ inputs.skip-verify }}
        SKIP_CHECKSUM: ${{ inputs.skip-checksum }}
        SKIP_MINISIGN: ${{ inputs.skip-minisign }}
        SKIP_SIGSTORE: ${{ inputs.skip-sigstore }}
        SKIP_ATTESTATION: ${{ inputs.skip-attestation }}
        SKIP_AUTHENTICODE: ${{ inputs.skip-authenticode }}
      run: |
        set -euo pipefail
        ghr_version="$(ghr version)"
        if ! ghr_target="$(ghr version --target 2>/dev/null)"; then
          echo "error: ghr ${ghr_version} does not support target-aware action cache keys" >&2
          echo "       pin this action to a release with target-aware cache keys, or set ghr-version accordingly" >&2
          exit 1
        fi
        if [[ ! "$ghr_target" =~ ^[A-Za-z0-9_]+-[A-Za-z0-9_]+-[A-Za-z0-9_]+$ ]]; then
          echo "error: ghr ${ghr_version} does not report a cache-safe target ABI" >&2
          echo "       pin this action to a release with target-aware cache keys, or set ghr-version accordingly" >&2
          exit 1
        fi
        canonical_lines=()
        while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
          line="${raw_line#"${raw_line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [[ -z "$line" ]] && continue
          [[ "${line:0:1}" == "#" ]] && continue
          read -ra tokens <<< "$line"
          if (( ${#tokens[@]} != 1 )); then
            echo "error: each download tools line must contain exactly one source" >&2
            exit 1
          fi
          canonical_lines+=("${tokens[0]}")
        done <<< "${TOOLS_INPUT}"
        if (( ${#canonical_lines[@]} == 0 )); then
          echo "error: 'tools' input is empty" >&2
          exit 1
        fi
        sorted_specs="$(printf '%s\n' "${canonical_lines[@]}" | LC_ALL=C sort -u)"

        cache_material="$(
          printf '%s\n' \
            'download-cache-schema=2' \
            "extract=${EXTRACT}" \
            "strip-components=${STRIP}" \
            "minisign=${MINISIGN}" \
            "skip-verify=${SKIP_VERIFY}" \
            "skip-checksum=${SKIP_CHECKSUM}" \
            "skip-minisign=${SKIP_MINISIGN}" \
            "skip-sigstore=${SKIP_SIGSTORE}" \
            "skip-attestation=${SKIP_ATTESTATION}" \
            "skip-authenticode=${SKIP_AUTHENTICODE}"
          while IFS= read -r spec; do
            printf 'source=%s\n' "$spec"
          done <<< "$sorted_specs"
        )"
        # macOS runner images don't always ship GNU coreutils' `sha256sum`
        # (e.g. the `macos-14` image), so fall back to `shasum -a 256`. Both
        # emit the same SHA-256 hex, so the cache key is identical either way.
        if command -v sha256sum >/dev/null 2>&1; then
          definition_hash="$(printf '%s' "$cache_material" | sha256sum | cut -c1-16)"
        else
          definition_hash="$(printf '%s' "$cache_material" | shasum -a 256 | cut -c1-16)"
        fi
        extract_tag="x0"
        if [[ "${EXTRACT}" == "true" ]]; then extract_tag="x1"; fi
        strip_tag="s${STRIP:-0}"
        key="ghr-dl-${RUNNER_OS}-${RUNNER_ARCH}-${ghr_target}-cfg2-ghrv${ghr_version}-${extract_tag}-${strip_tag}-${definition_hash}"
        {
          echo "key=$key"
          echo "ghr_version=$ghr_version"
          echo 'sorted_specs<<__GHR_EOF__'
          echo "$sorted_specs"
          echo '__GHR_EOF__'
        } >> "$GITHUB_OUTPUT"

    - name: Restore ghr download cache
      id: ghr-cache
      if: inputs.cache == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ steps.ghr-dest.outputs.dest }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Download assets with ghr
      if: steps.ghr-cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: ${{ steps.ghr-dest.outputs.dest }}
      env:
        SORTED_SPECS: ${{ steps.cache-key.outputs.sorted_specs }}
        EXTRACT: ${{ inputs.extract }}
        STRIP: ${{ inputs.strip-components }}
        DEST: ${{ steps.ghr-dest.outputs.dest }}
        MINISIGN: ${{ inputs.minisign }}
        SKIP_VERIFY: ${{ inputs.skip-verify }}
        SKIP_CHECKSUM: ${{ inputs.skip-checksum }}
        SKIP_MINISIGN: ${{ inputs.skip-minisign }}
        SKIP_SIGSTORE: ${{ inputs.skip-sigstore }}
        SKIP_ATTESTATION: ${{ inputs.skip-attestation }}
        SKIP_AUTHENTICODE: ${{ inputs.skip-authenticode }}
        KEEP_GOING: ${{ inputs.keep-going }}
      run: |
        set -euo pipefail
        flags=()
        if [[ "${EXTRACT}" == "true" ]]; then flags+=(--extract "${DEST}"); fi
        if [[ -n "${STRIP}" ]]; then flags+=(--strip-components "${STRIP}"); fi
        if [[ "${KEEP_GOING}" == "true" ]]; then flags+=(--keep-going); fi
        if [[ "${SKIP_VERIFY}" == "true" ]]; then flags+=(--skip-verify); fi
        if [[ "${SKIP_CHECKSUM}" == "true" ]]; then flags+=(--skip-checksum); fi
        if [[ "${SKIP_MINISIGN}" == "true" ]]; then flags+=(--skip-minisign); fi
        if [[ "${SKIP_SIGSTORE}" == "true" ]]; then flags+=(--skip-sigstore); fi
        if [[ "${SKIP_ATTESTATION}" == "true" ]]; then flags+=(--skip-attestation); fi
        if [[ "${SKIP_AUTHENTICODE}" == "true" ]]; then flags+=(--skip-authenticode); fi
        if [[ -n "${MINISIGN}" ]]; then flags+=(--minisign "${MINISIGN}"); fi
        specs=()
        while IFS= read -r spec; do
          [[ -z "$spec" ]] && continue
          specs+=("$spec")
        done <<< "${SORTED_SPECS}"
        ghr download \
          ${flags[@]+"${flags[@]}"} \
          ${specs[@]+"${specs[@]}"}

    - name: Sanity check (list dest)
      shell: bash
      run: ls -la "${{ steps.ghr-dest.outputs.dest }}"
