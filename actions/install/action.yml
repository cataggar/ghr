name: 'ghr install'
description: >-
  Install one or more tools from GitHub releases using `ghr`. Caches the
  installed tools (binaries + extracted artifacts) across workflow runs so a
  cache-hit reduces the install step to a near-instant restore.
author: 'cataggar/ghr contributors'
branding:
  icon: 'download-cloud'
  color: 'gray-dark'

inputs:
  tools:
    description: >-
      Newline-separated install requests. Each line is
      `<source> [?id=...&alias=...] [minisign-key]`; the query token may be
      quoted, and a bare key remains compatible. Lines that are empty or start
      with `#` are ignored.
    required: true
  cache:
    description: >-
      Cache installed tools across runs. Default: true. The cache key is
      `os + arch + ABI + normalized install definitions + state layout + ghr
      version`, so changing an ID, source, alias, verification policy, key, or
      ghr version invalidates the cache cleanly.
    required: false
    default: 'true'
  minisign:
    description: >-
      Optional base64 minisign public key applied as the default for every
      `tools:` line that does not include its own inline key. When set, ghr
      requires a `.minisig` sidecar to be present and verifies it. An inline
      key on a `tools:` line (the second whitespace-separated token, e.g.
      `jedisct1/minisign@0.12 RWQf6LR…`) overrides this default for that
      single request.
    required: false
    default: ''
  skip-verify:
    description: >-
      Umbrella flag: skip every verification step (checksum, minisign,
      sigstore, GitHub attestation, authenticode). Default: false.
    required: false
    default: 'false'
  skip-checksum:
    description: >-
      Skip just the checksum-sidecar verification step. Default: false.
    required: false
    default: 'false'
  skip-minisign:
    description: >-
      Skip just the minisign verification step. Bypasses the fail-closed
      behavior that would otherwise reject a published `.minisig` sidecar
      when no key is configured. Default: false.
    required: false
    default: 'false'
  skip-sigstore:
    description: >-
      Skip just the verification of a `.sigstore.json` sidecar published as a
      release asset. Does not affect GitHub's attestation service; use
      `skip-attestation` for that. Default: false.
    required: false
    default: 'false'
  skip-attestation:
    description: >-
      Skip just the GitHub artifact attestation verification step.
      Attestations are looked up from GitHub's attestation API by the
      downloaded file's digest rather than published as release assets, so
      this is independent of `skip-sigstore`. Default: false.
    required: false
    default: 'false'
  skip-authenticode:
    description: >-
      Skip just the Authenticode (Windows PE) verification step.
      Default: false.
    required: false
    default: 'false'
  keep-going:
    description: >-
      Continue past per-spec failures. The job step still exits non-zero
      if any spec failed, but every spec is attempted first.
    required: false
    default: 'false'
  ghr-version:
    description: >-
      Exact ghr release tag or version. By default an exact action tag such as
      `@v0.8.0` selects the matching CLI release. Commit-, branch-, and
      floating-tag pins must set this input explicitly; `latest` and version
      ranges are rejected.
    required: false
    default: ''
  ghr-sha256:
    description: >-
      Optional independently trusted SHA-256 for the selected ghr release
      archive. It must also match GitHub's release-asset digest. When omitted,
      GitHub release provenance is verified cryptographically with Sigstore.
    required: false
    default: ''
  ghr-token:
    description: >-
      Token used only to resolve and verify the ghr release. The downstream
      install command continues to use GH_TOKEN or GITHUB_TOKEN from env.
    required: false
    default: ${{ github.server_url == 'https://github.com' && github.token || '' }}
  ghr-cache:
    description: >-
      Cache the exact verified ghr archive and installation. This is separate
      from the installed-tools cache controlled by `cache`.
    required: false
    default: 'true'

outputs:
  cache-hit:
    description: >-
      `true` when the tool cache was restored from a prior run, `false`
      otherwise. Mirrors `actions/cache@v4`'s own `cache-hit` output.
    value: ${{ steps.ghr-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Setup verified ghr
      id: setup-ghr
      uses: $/actions/setup
      with:
        ghr-version: ${{ inputs.ghr-version || github.action_ref }}
        sha256: ${{ inputs.ghr-sha256 }}
        token: ${{ inputs.ghr-token }}
        cache: ${{ inputs.ghr-cache }}

    - name: Point ghr at a cacheable directory
      id: ghr-dirs
      shell: bash
      run: |
        set -euo pipefail
        tool_dir="${RUNNER_TEMP}/ghr-tools"
        bin_dir="${RUNNER_TEMP}/ghr-bin"
        cache_dir="${RUNNER_TEMP}/ghr-cache"
        mkdir -p "$tool_dir" "$bin_dir" "$cache_dir"
        echo "GHR_TOOL_DIR=$tool_dir"   >> "$GITHUB_ENV"
        echo "GHR_BIN_DIR=$bin_dir"     >> "$GITHUB_ENV"
        echo "GHR_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"
        echo "$bin_dir" >> "$GITHUB_PATH"
        echo "tool_dir=$tool_dir"   >> "$GITHUB_OUTPUT"
        echo "bin_dir=$bin_dir"     >> "$GITHUB_OUTPUT"
        echo "cache_dir=$cache_dir" >> "$GITHUB_OUTPUT"

    - name: Resolve cache key
      id: cache-key
      shell: bash
      env:
        TOOLS_INPUT: ${{ inputs.tools }}
        MINISIGN: ${{ inputs.minisign }}
        SKIP_VERIFY: ${{ inputs.skip-verify }}
        SKIP_CHECKSUM: ${{ inputs.skip-checksum }}
        SKIP_MINISIGN: ${{ inputs.skip-minisign }}
        SKIP_SIGSTORE: ${{ inputs.skip-sigstore }}
        SKIP_ATTESTATION: ${{ inputs.skip-attestation }}
        SKIP_AUTHENTICODE: ${{ inputs.skip-authenticode }}
      run: |
        set -euo pipefail
        ghr_version="$(ghr version)"
        install_help="$(ghr install --help)"
        if ! grep -Fq -- '--print-cache-key' <<< "$install_help" ||
           ! grep -Fq -- '--single-request' <<< "$install_help"; then
          echo "error: ghr ${ghr_version} does not support stable-ID action cache keys" >&2
          echo "       pin this action to a release with an ID-capable ghr, or set ghr-version accordingly" >&2
          exit 1
        fi
        if ! ghr_target="$(ghr version --target 2>/dev/null)"; then
          echo "error: ghr ${ghr_version} does not support target-aware action cache keys" >&2
          echo "       pin this action to a release with an ID-capable ghr, or set ghr-version accordingly" >&2
          exit 1
        fi
        if [[ ! "$ghr_target" =~ ^[A-Za-z0-9_]+-[A-Za-z0-9_]+-[A-Za-z0-9_]+$ ]]; then
          echo "error: ghr ${ghr_version} did not report a cache-safe target ABI" >&2
          exit 1
        fi

        # Each non-comment line is one complete request:
        #   source [query-token] [bare-minisign-key]
        # Quotes around the query token are accepted for parity with shell
        # examples, but are not required inside a YAML block scalar.
        request_tokens=()
        while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
          line="${raw_line#"${raw_line%%[![:space:]]*}"}"  # ltrim
          line="${line%"${line##*[![:space:]]}"}"          # rtrim
          [[ -z "$line" ]] && continue
          [[ "${line:0:1}" == "#" ]] && continue
          read -ra tokens <<< "$line"
          n="${#tokens[@]}"
          if (( n < 1 || n > 3 )); then
            printf 'error: tools line must be `source [query] [key]`, got %d tokens\n' "$n" >&2
            exit 1
          fi

          line_tokens=("${tokens[0]}")
          for (( i=1; i<n; i++ )); do
            token="${tokens[$i]}"
            case "$token" in
              \"*\") token="${token#\"}"; token="${token%\"}" ;;
              \'*\') token="${token#\'}"; token="${token%\'}" ;;
            esac
            line_tokens+=("$token")
          done
          ghr install --print-cache-key --single-request "${line_tokens[@]}" >/dev/null
          request_tokens+=("${line_tokens[@]}")
        done <<< "${TOOLS_INPUT}"

        if (( ${#request_tokens[@]} == 0 )); then
          echo "error: 'tools' input is empty" >&2
          exit 1
        fi

        flags=()
        if [[ "${SKIP_VERIFY}" == "true" ]]; then flags+=(--skip-verify); fi
        if [[ "${SKIP_CHECKSUM}" == "true" ]]; then flags+=(--skip-checksum); fi
        if [[ "${SKIP_MINISIGN}" == "true" ]]; then flags+=(--skip-minisign); fi
        if [[ "${SKIP_SIGSTORE}" == "true" ]]; then flags+=(--skip-sigstore); fi
        if [[ "${SKIP_ATTESTATION}" == "true" ]]; then flags+=(--skip-attestation); fi
        if [[ "${SKIP_AUTHENTICODE}" == "true" ]]; then flags+=(--skip-authenticode); fi
        if [[ -n "${MINISIGN}" ]]; then flags+=(--minisign "${MINISIGN}"); fi
        definition_hash="$(
          ghr install --print-cache-key \
            ${flags[@]+"${flags[@]}"} \
            ${request_tokens[@]+"${request_tokens[@]}"}
        )"
        if [[ ! "$definition_hash" =~ ^[0-9a-f]{64}$ ]]; then
          echo "error: ghr returned an invalid install cache fingerprint" >&2
          exit 1
        fi
        key="ghr-${RUNNER_OS}-${RUNNER_ARCH}-${ghr_target}-layout2-ghrv${ghr_version}-${definition_hash:0:16}"
        {
          echo "key=$key"
          echo "ghr_version=$ghr_version"
          echo 'request_tokens<<__GHR_EOF__'
          printf '%s\n' "${request_tokens[@]}"
          echo '__GHR_EOF__'
        } >> "$GITHUB_OUTPUT"

    - name: Restore ghr tool cache
      id: ghr-cache
      if: inputs.cache == 'true'
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: |
          ${{ steps.ghr-dirs.outputs.tool_dir }}
          ${{ steps.ghr-dirs.outputs.bin_dir }}
          ${{ steps.ghr-dirs.outputs.cache_dir }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Install tools with ghr
      if: steps.ghr-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        REQUEST_TOKENS: ${{ steps.cache-key.outputs.request_tokens }}
        MINISIGN: ${{ inputs.minisign }}
        SKIP_VERIFY: ${{ inputs.skip-verify }}
        SKIP_CHECKSUM: ${{ inputs.skip-checksum }}
        SKIP_MINISIGN: ${{ inputs.skip-minisign }}
        SKIP_SIGSTORE: ${{ inputs.skip-sigstore }}
        SKIP_ATTESTATION: ${{ inputs.skip-attestation }}
        SKIP_AUTHENTICODE: ${{ inputs.skip-authenticode }}
        KEEP_GOING: ${{ inputs.keep-going }}
      run: |
        set -euo pipefail
        flags=()
        if [[ "${KEEP_GOING}" == "true" ]]; then flags+=(--keep-going); fi
        if [[ "${SKIP_VERIFY}" == "true" ]]; then flags+=(--skip-verify); fi
        if [[ "${SKIP_CHECKSUM}" == "true" ]]; then flags+=(--skip-checksum); fi
        if [[ "${SKIP_MINISIGN}" == "true" ]]; then flags+=(--skip-minisign); fi
        if [[ "${SKIP_SIGSTORE}" == "true" ]]; then flags+=(--skip-sigstore); fi
        if [[ "${SKIP_ATTESTATION}" == "true" ]]; then flags+=(--skip-attestation); fi
        if [[ "${SKIP_AUTHENTICODE}" == "true" ]]; then flags+=(--skip-authenticode); fi
        if [[ -n "${MINISIGN}" ]]; then flags+=(--minisign "${MINISIGN}"); fi
        # REQUEST_TOKENS is one already-validated CLI token per line. Keeping
        # request tokens together avoids sorting a query or key away from its
        # source.
        positionals=()
        while IFS= read -r token; do
          [[ -z "$token" ]] && continue
          positionals+=("$token")
        done <<< "${REQUEST_TOKENS}"
        # Bash 3.2 (macOS `/bin/bash`) treats `"${arr[@]}"` on an empty
        # array as an unbound variable under `set -u`. Use the
        # `${arr[@]+...}` guard so an empty `flags`/`positionals` expands to
        # zero words instead of erroring.
        ghr install ${flags[@]+"${flags[@]}"} ${positionals[@]+"${positionals[@]}"}

    - name: Sanity check (ghr list)
      shell: bash
      run: ghr list
