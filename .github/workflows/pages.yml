name: Publish website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://cataggar.github.io/ghr/
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Zig
        uses: cataggar/ghr/actions/install@ab95a8ea0632291f6b2a1ec0a7e81b11ec8ac01b
        with:
          ghr-version: v0.8.1
          tools: cataggar/zig@v0.17.0 RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U

      - name: Build static website
        working-directory: website
        run: zig build prod

      - name: Publish the independent website branch
        env:
          PUBLISH_DIR: ${{ runner.temp }}/ghr-published-website
        run: |
          set -euo pipefail
          test -f website/dist/index.html
          test -f website/dist/docs.html
          test ! -e "$PUBLISH_DIR"
          gh auth setup-git
          git init --quiet --initial-branch=website "$PUBLISH_DIR"
          git -C "$PUBLISH_DIR" remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          existing=$(git -C "$PUBLISH_DIR" ls-remote --heads origin refs/heads/website)
          if [ -n "$existing" ]; then
            git -C "$PUBLISH_DIR" fetch --quiet --no-tags origin website
            # Retain the branch parent without checking out obsolete static files.
            git -C "$PUBLISH_DIR" reset --soft FETCH_HEAD
          fi
          cp -a website/dist/. "$PUBLISH_DIR/"
          touch "$PUBLISH_DIR/.nojekyll"
          git -C "$PUBLISH_DIR" config user.name 'github-actions[bot]'
          git -C "$PUBLISH_DIR" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$PUBLISH_DIR" add --all
          if ! git -C "$PUBLISH_DIR" rev-parse --verify HEAD >/dev/null 2>&1 || \
             ! git -C "$PUBLISH_DIR" diff --cached --quiet; then
            git -C "$PUBLISH_DIR" commit --quiet \
              -m "Publish website from $GITHUB_SHA" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git -C "$PUBLISH_DIR" push origin HEAD:refs/heads/website
          fi

      - name: Check the Pages source and request a build
        run: |
          set -euo pipefail
          configured=$(gh api "repos/$GITHUB_REPOSITORY/pages" \
            --jq '.build_type == "legacy" and .source.branch == "website" and .source.path == "/"')
          if [ "$configured" != true ]; then
            echo '::error::An administrator must configure GitHub Pages to deploy from website / (root). See README.md.'
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
